# AeroSpork: the default config
#
# AeroSpork ships this file inside the app and uses it when you have no config of your own.
# To make it yours, copy it and edit the copy:
#   cp /Applications/AeroSpork.app/Contents/Resources/default-config.toml ~/.aerospork.toml
# (A debug build reads ~/.aerospork-debug.toml instead.)
#
# Every key below is optional. If you delete a key, AeroSpork uses its built-in default, and that
# is not always the value shown here: without [gaps] the gaps are 0, and without `mod` AeroSpork
# generates no bindings. If you delete your copy, AeroSpork uses this file again.
# A saved change applies at once.
#
# The guide documents every key: https://aerospork.app/docs/guide.html
# Each command has a page: `aerospork <command> --help`, or `man aerospork-<command>`.

# ---------------------------------------------------------------------------------------------
# The two lines most people ever need
# ---------------------------------------------------------------------------------------------

# Base modifier for the generated bindings listed under [keys] below.
# If you remove this line, AeroSpork generates no bindings, and you bind everything yourself.
mod = "alt"

# Workspaces you want. A range ("1-9"), a list (["dev", "web", "chat"]), or both (["1-9", "dev"]).
# Each one gets   mod-<key>        -> switch to it
#                 mod-shift-<key>  -> move the focused window to it
# where <key> is the first character of the name, lower-cased ("dev" -> mod-d).
# Workspaces listed here always exist, even while empty, so the menu bar, `list-workspaces` and
# `workspace next/prev` show all of them. AeroSpork creates any other workspace when you switch to
# it, and releases it when it is empty.
workspaces = "1-9"

# ---------------------------------------------------------------------------------------------
# Gaps
# ---------------------------------------------------------------------------------------------

[gaps]
inner = 8    # between windows
outer = 8    # between windows and the monitor edge
# Per-edge instead:   outer = { top = 32, bottom = 8, left = 8, right = 8 }
# Per-monitor:        outer = [{ monitor.main = 16 }, 8]

# ---------------------------------------------------------------------------------------------
# Keys
# ---------------------------------------------------------------------------------------------
#
# AeroSpork generates these from `mod`, and they are already active. They are listed here so
# that you can see them:
#
#   mod-h / j / k / l              focus left / down / up / right
#   mod-shift-h / j / k / l        move window
#   mod-minus / mod-equal          shrink / grow
#   mod-slash / mod-comma          tiles / accordion layout
#   mod-tab                        previous workspace
#
# Anything you put in [keys] wins over a generated binding with the same key.

[keys]
alt-shift-semicolon = "mode service"
# alt-enter = "exec-and-forget open -na Ghostty"

# A binding mode. Enter it with `mode <name>`. Leave it with `mode main`.
[keys.service]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "mode main"]
f = ["layout floating tiling", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]

# ---------------------------------------------------------------------------------------------
# Monitors
# ---------------------------------------------------------------------------------------------
#
# Pin a workspace to a monitor. The value can be:
#   "main" / "secondary"            the main monitor / the other one, when there are exactly two
#   2                               monitor by position, left to right
#   "LG|DELL"                       case-insensitive regex on the name
#   { uuid = "..." }                the exact monitor: survives docking and identical models
#   { vendor = "0x10AC", model = "0x4276" }
#
# Run `aerospork list-monitors --format '%{monitor-fingerprint}'` to see what to put here.
# Prefer `uuid`: it is the only key that separates two monitors of the same model, and the only
# one DisplayLink panels have at all.

# [monitors]
# 1 = "main"
# 2 = { uuid = "AAAAAAAA-0000-4000-8000-000000000001" }

# ---------------------------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------------------------
#
# A window rule runs when a window of the app appears. The key is the bundle ID of the app
# (`aerospork list-apps` prints them). To match by app name, window title or workspace, use
# [[on-window-detected]]: https://aerospork.app/docs/guide.html#on-window-detected-callback

# [on-window]
# "com.apple.mail" = "move-node-to-workspace 3"
# "com.apple.systempreferences" = "layout floating"

# ---------------------------------------------------------------------------------------------
# Everything else
# ---------------------------------------------------------------------------------------------

# start-at-login = false
# accordion-padding = 30
# default-root-container-layout = "tiles"       # tiles | accordion
# default-root-container-orientation = "auto"   # auto | horizontal | vertical
#
# Run something after AeroSpork starts:
# after-startup-command = ["exec-and-forget sketchybar --reload"]
#
# Run something when focus moves. `move-mouse window-lazy-center` makes the pointer follow you,
# including between workspaces on the same monitor:
# on-focused-workspace-changed = ["move-mouse window-lazy-center"]
