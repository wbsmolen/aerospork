<!-- @dsCard group="Components" viewport="700x330" name="Feedback" subtitle="Config banners, status labels, empty states, provenance badges" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Feedback</title><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--grouped-bg);margin:0;padding:14px 16px;font-family:var(--font-system);color:var(--label)}
.grid{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:var(--text-caption);color:var(--label-tertiary);letter-spacing:.05em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Banner, StatusLabel, ContentUnavailable, Badge } = window.AeroSporkDesignSystem_078bd7;
function Card() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ borderRadius: 8, overflow: 'hidden', boxShadow: '0 0 0 0.5px var(--separator)' }}>
        <Banner kind="error">Your config was not loaded — AeroSpork is running built-in defaults. Fix the errors below and save; the config reloads by itself.</Banner>
        <Banner kind="warning">alt-shift-semicolon is bound twice in “main”; the last one wins.</Banner>
      </div>
      <div style={{ display: 'flex', gap: 24, alignItems: 'flex-start' }}>
        <div className="col">
          <span className="lbl">Status</span>
          <StatusLabel kind="neutral">Matches the file on disk</StatusLabel>
          <StatusLabel kind="ok">Valid — press Apply (⌘S) to write it</StatusLabel>
          <StatusLabel kind="error">line 12: unknown key ‘mode’</StatusLabel>
          <span className="lbl" style={{ marginTop: 6 }}>Badges</span>
          <div className="row"><Badge help="Generated from mod and workspaces.">generated</Badge><Badge tone="muted" help="Only applies while AeroSpork is starting up">startup</Badge></div>
        </div>
        <div style={{ flex: 1, background: 'var(--control-bg)', borderRadius: 8, boxShadow: '0 0 0 0.5px var(--separator)', height: 190 }}>
          <ContentUnavailable sf="arrow.triangle.branch" title="No assignments"
            message="Workspaces land wherever they were last used. Add an assignment to pin one to a specific monitor."
            actionTitle="Add assignment" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body></html>
