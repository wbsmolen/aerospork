<!-- @dsCard group="Components" viewport="700x260" name="Controls" subtitle="Buttons, toggle, fields, pickers, key recorder — the AppKit control set" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Controls</title><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--grouped-bg);margin:0;padding:14px 16px;font-family:var(--font-system);color:var(--label)}
.grid{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:var(--text-caption);color:var(--label-tertiary);letter-spacing:.05em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Button, Toggle, TextField, NumberField, SegmentedPicker, Select, CopyButton, KeyRecorderField, Icon } = window.AeroSporkDesignSystem_078bd7;
function Card() {
  const [on, setOn] = React.useState(true);
  const [layout, setLayout] = React.useState('Tiles');
  const [rec, setRec] = React.useState(false);
  const [n, setN] = React.useState(8);
  return (
    <div className="grid">
      <div className="col"><span className="lbl">Buttons</span>
        <div className="row"><Button>Revert</Button><Button variant="prominent">Apply</Button><Button disabled>Apply</Button></div>
        <div className="row"><Button variant="borderless">Override</Button><Button variant="borderless" destructive>Delete “resize”</Button>
          <Button variant="borderless" iconOnly title="Remove"><Icon sf="minus.circle" size={13} /></Button></div>
      </div>
      <div className="col" style={{ width: 250 }}><span className="lbl">Toggle</span>
        <Toggle label="Start AeroSpork at login" checked={on} onChange={setOn} />
        <Toggle label="Show icon in the Dock" checked disabled />
      </div>
      <div className="col"><span className="lbl">Fields</span>
        <div className="row"><TextField value="focus left" mono width={150} /><TextField variant="plain" placeholder="Filter" width={90} /></div>
        <div style={{ width: 250 }}><NumberField title="Horizontal" value={n} onChange={setN} /></div>
      </div>
      <div className="col"><span className="lbl">Pickers</span>
        <SegmentedPicker options={['Tiles', 'Accordion']} value={layout} onChange={setLayout} />
        <Select value="main" options={[{ value: 'main', label: 'Main' }, { value: 'secondary', label: 'Non-main' }]} width={150} />
      </div>
      <div className="col"><span className="lbl">Key recorder</span>
        <KeyRecorderField notation="alt-shift-h" showsClear={false} />
        <KeyRecorderField notation={rec ? '' : 'cmd-alt-4'} recording={rec} onArm={setRec} width={170} />
      </div>
      <div className="col"><span className="lbl">Copy</span>
        <div className="row" style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--text-caption)', color: 'var(--label-tertiary)' }}>AAAAAAAA…<CopyButton value="AAAAAAAA-0000-4000-8000-000000000001" /></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body></html>
